name: Bootstrap packaging lockfile

on:
  push:
    branches:
      - maintenance/windows-packaging
    paths:
      - .github/workflows/bootstrap-packaging-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/windows-packaging

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Refresh npm lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-packaging-lockfile.yml
          git add package-lock.json
          git commit \
            -m "[v0.1.0][Maintenance] Lock Windows packaging dependencies" \
            -m "Purpose: Commit the reproducible npm graph required by Issue #12 Windows packaging." \
            -m "Changes: Lock electron-builder 26.15.7, @electron/asar 4.2.1 and their resolved development dependency graph; remove the temporary bootstrap workflow." \
            -m "Verification: Final read-only CI runs npm ci, tests, package checks and Windows builds from this lockfile." \
            -m "Issue: #12"
          git push origin HEAD:maintenance/windows-packaging
