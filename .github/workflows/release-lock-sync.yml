name: Release lock metadata sync

on:
  push:
    branches:
      - release/application-foundation

permissions:
  contents: write

jobs:
  sync-lock-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/application-foundation
          persist-credentials: true

      - name: Align lockfile root metadata with package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock.json root package entry is missing.');
          lock.version = packageJson.version;
          lock.packages[''].version = packageJson.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`, 'utf8');
          NODE
          git diff --check

      - name: Commit synchronized lock metadata
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lock metadata already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit \
            -m "[v0.1.0][Maintenance] Sync release lock metadata" \
            -m "Purpose: Align deterministic dependency-lock root metadata with the final v0.1.0 package version." \
            -m "Changes: Update only the package-lock root application version fields; dependency pins and integrity hashes remain unchanged." \
            -m "Verification: git diff --check completed before commit; release PR CI will run the authoritative repository checks." \
            -m "Issue: #13"
          git push origin HEAD:release/application-foundation
