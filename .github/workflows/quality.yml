name: Quality and privacy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-v021:
    name: Temporary v0.2.1 bookkeeping bootstrap
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'maintenance/project-board-sync' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/project-board-sync
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Align v0.2.1 package and lock metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lockJson = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          packageJson.version = '0.2.1';
          packageJson.scripts = packageJson.scripts || {};
          packageJson.scripts['sync:project'] = 'node scripts/project-board-sync.cjs';
          lockJson.version = '0.2.1';
          if (!lockJson.packages?.['']) throw new Error('package-lock root package entry is missing');
          lockJson.packages[''].version = '0.2.1';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lockJson, null, 2)}\n`);
          NODE

      - name: Reconcile v0.2.1 into Development Index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2026-03-10',
            'Content-Type': 'application/json'
          };
          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${url} failed: ${response.status} ${await response.text()}`);
            return response.status === 204 ? null : response.json();
          }
          const url = `https://api.github.com/repos/${repository}/issues/1`;
          const issue = await request(url);
          let body = issue.body || '';
          if (!body.includes('- #132 — v0.2.1 Project Board Automation')) {
            body = body.replace(
              '- #14 — v0.2.0 Media Intelligence',
              '- #14 — v0.2.0 Media Intelligence\n- #132 — v0.2.1 Project Board Automation'
            );
          }
          if (!body.includes('## v0.2.1 — Project Board Automation')) {
            const section = `## v0.2.1 — Project Board Automation
Parent umbrella: **#132**.

| Priority | Complexity | Title | Status | Type | Target Release | Area | Branch | Start Date | Target Date |
| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
| Critical | Large | #132 — \`[Roadmap][Umbrella][v0.2.1] Project Board Automation\` | In Progress | — | v0.2.1 | Project Management / Automation / GitHub | — | 2026-08-13 | 2026-08-13 |
| Critical | Large | #131 — Automate and fully reconcile GitHub Project board | In Progress | Maintenance | v0.2.1 | Project Management / Automation / GitHub | \`maintenance/project-board-sync\` | 2026-08-13 | 2026-08-13 |

**Current release note — started 2026-08-13:** v0.2.1 is a focused maintenance release to make the GitHub Project the live development control room. #131 owns full-board backfill and automatic lifecycle/field synchronization. The release remains In Progress until #131 is reviewed, merged and its Project reconciliation path is verified.

**Branch:** #131 \`maintenance/project-board-sync\`. Umbrella #132 remains branchless.

**Dependency:** v0.2.0 is complete. v0.2.1 should complete before v0.3.0 development relies on automated Project state.

---

`;
            const marker = '## v0.3.0 — Content Studio';
            if (!body.includes(marker)) throw new Error('Could not find v0.3.0 section marker in Index');
            body = body.replace(marker, `${section}${marker}`);
          }
          if (!body.includes('| **v0.2.1** | #132 | In Progress |')) {
            const row = '| **v0.2.1** | #132 | In Progress | Project Board Automation — complete Project backfill and automatic lifecycle/planning-field synchronization. |\n';
            const marker = '| **v0.3.0** | #23 | Planned |';
            const index = body.indexOf(marker);
            if (index < 0) throw new Error('Could not find v0.3.0 roadmap-summary row in Index');
            body = `${body.slice(0, index)}${row}${body.slice(index)}`;
          }
          if (body !== issue.body) {
            await request(url, { method: 'PATCH', body: JSON.stringify({ body }) });
          }
          NODE

      - name: Commit aligned release metadata to the dedicated branch
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Package and lock metadata already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          cat > /tmp/commit-message.txt <<'MSG'
          [v0.2.1][Maintenance] Align release metadata

          Purpose:
          Align authoritative package and lock metadata to the active v0.2.1 Project Board Automation release.

          Changes:
          Set package/lock versions to 0.2.1 and expose the Project synchronization developer command.

          Verification:
          Final read-only repository CI runs after this deterministic bookkeeping commit.

          Issue:
          #131
          MSG
          git commit -F /tmp/commit-message.txt
          git push origin HEAD:maintenance/project-board-sync

  core:
    name: Core quality gate (Linux)
    if: github.head_ref != 'maintenance/project-board-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run repository privacy guard
        run: npm run check:privacy

      - name: Run source security policy
        run: npm run check:security

      - name: Validate workflow policy
        run: npm run check:workflow

      - name: Run canonical project integrity gate
        run: npm run check

      - name: Run lint/static checks
        run: npm run lint

      - name: Review production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Check changed-file whitespace
        run: git diff --check

  windows:
    name: Windows core and Electron preflight
    if: github.head_ref != 'maintenance/project-board-sync'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete automated tests
        run: npm test

      - name: Run Windows path and storage regression selection
        run: npm run test:windows

      - name: Run canonical project integrity gate
        run: npm run check

      - name: Run lint/static checks
        run: npm run lint

      - name: Run Electron non-interactive preflight
        run: npm run smoke:electron

      - name: Check changed-file whitespace
        run: git diff --check
